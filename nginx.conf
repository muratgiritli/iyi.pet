server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/(wp-login\.php|wp-admin|xmlrpc\.php) {
        return 410;
    }

    location ~* ^/sitemap(-[a-z0-9-]+)?\.(xml|xsl)$ {
        types { }
        default_type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ~* ^/llms(-full)?\.txt$ {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /site.webmanifest {
        default_type "application/manifest+json; charset=utf-8";
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
