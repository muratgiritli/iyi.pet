server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    port_in_redirect off;

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    location = /favicon.ico {
        types { }
        default_type image/x-icon;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:webp|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~ ^/llms(?:-full)?\.txt$ {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Single-hop HTTPS trailing-slash redirects for canonical directories
    location = /atakum-petshop { return 301 https://www.jetgomarket.com/atakum-petshop/; }
    location = /samsun-petshop { return 301 https://www.jetgomarket.com/samsun-petshop/; }
