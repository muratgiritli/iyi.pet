openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: brands
    description: Brand operations
  - name: reviews
    description: Review operations
  - name: settings
    description: Settings operations
  - name: admin
    description: Admin operations
  - name: stats
    description: Statistics operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /brands:
    get:
      operationId: listBrands
      tags: [brands]
      summary: List all brands
      responses:
        "200":
          description: List of brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
    post:
      operationId: createBrand
      tags: [brands]
      summary: Create a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /brands/{id}:
    patch:
      operationId: updateBrand
      tags: [brands]
      summary: Update a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteBrand
      tags: [brands]
      summary: Delete a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List all reviews (admin, includes personal info)
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminReview"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid input or contains banned words
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reviews/public:
    get:
      operationId: listPublicReviews
      tags: [reviews]
      summary: List approved reviews (public, no personal info)
      responses:
        "200":
          description: List of approved reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /reviews/{id}/status:
    patch:
      operationId: updateReviewStatus
      tags: [reviews]
      summary: Update a review's moderation status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReview"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reviews/{id}:
    delete:
      operationId: deleteReview
      tags: [reviews]
      summary: Delete a review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reviews/{id}/vote:
    post:
      operationId: voteReview
      tags: [reviews]
      summary: Cast or change a helpful/unhelpful vote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteInput"
      responses:
        "200":
          description: Updated vote counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reviews/{id}/report:
    post:
      operationId: reportReview
      tags: [reviews]
      summary: Report a review as inappropriate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reviews/bulk:
    post:
      operationId: bulkReviewAction
      tags: [reviews]
      summary: Apply an action to multiple reviews
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkReviewInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get site settings (no password)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Validate admin credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"

  /admin/password:
    post:
      operationId: changeAdminPassword
      tags: [admin]
      summary: Change admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Brand:
      type: object
      required:
        - id
        - name
        - slug
        - rating
        - reviewCount
        - category
        - origin
        - logoText
        - logoColor
        - logoBg
        - verified
        - websiteUrl
        - productsUrl
        - description
        - pinned
        - pinnedRank
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        category: { type: string }
        origin: { type: string }
        logoText: { type: string }
        logoColor: { type: string }
        logoBg: { type: string }
        verified: { type: boolean }
        websiteUrl: { type: string }
        productsUrl: { type: string }
        description: { type: string }
        pinned: { type: boolean }
        pinnedRank: { type: integer }

    BrandInput:
      type: object
      required:
        - name
        - slug
        - logoText
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        rating: { type: number }
        reviewCount: { type: integer }
        category: { type: string }
        origin: { type: string }
        logoText: { type: string, minLength: 1 }
        logoColor: { type: string }
        logoBg: { type: string }
        verified: { type: boolean }
        websiteUrl: { type: string }
        productsUrl: { type: string }
        description: { type: string }
        pinned: { type: boolean }
        pinnedRank: { type: integer }

    BrandUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        rating: { type: number }
        reviewCount: { type: integer }
        category: { type: string }
        origin: { type: string }
        logoText: { type: string, minLength: 1 }
        logoColor: { type: string }
        logoBg: { type: string }
        verified: { type: boolean }
        websiteUrl: { type: string }
        productsUrl: { type: string }
        description: { type: string }
        pinned: { type: boolean }
        pinnedRank: { type: integer }

    Review:
      type: object
      required:
        - id
        - brandId
        - author
        - avatar
        - rating
        - title
        - text
        - petType
        - status
        - helpfulCount
        - unhelpfulCount
        - reportCount
        - createdAt
      properties:
        id: { type: integer }
        brandId: { type: integer }
        author: { type: string }
        avatar: { type: string }
        rating: { type: integer }
        title: { type: string }
        text: { type: string }
        petType: { type: string }
        photoBase64: { type: ["string", "null"] }
        status: { type: string }
        helpfulCount: { type: integer }
        unhelpfulCount: { type: integer }
        reportCount: { type: integer }
        createdAt: { type: string }

    AdminReview:
      type: object
      required:
        - id
        - brandId
        - firstName
        - lastName
        - phone
        - author
        - avatar
        - rating
        - title
        - text
        - petType
        - status
        - helpfulCount
        - unhelpfulCount
        - reportCount
        - createdAt
      properties:
        id: { type: integer }
        brandId: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        author: { type: string }
        avatar: { type: string }
        rating: { type: integer }
        title: { type: string }
        text: { type: string }
        petType: { type: string }
        photoBase64: { type: ["string", "null"] }
        status: { type: string }
        helpfulCount: { type: integer }
        unhelpfulCount: { type: integer }
        reportCount: { type: integer }
        createdAt: { type: string }

    ReviewInput:
      type: object
      required:
        - brandId
        - firstName
        - lastName
        - phone
        - rating
        - text
      properties:
        brandId: { type: integer }
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        phone: { type: string, minLength: 10 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        text: { type: string, minLength: 10 }
        petType: { type: string }
        photoBase64: { type: ["string", "null"] }

    ReviewStatusUpdate:
      type: object
      required:
        - status
      properties:
        status: { type: string }

    VoteInput:
      type: object
      properties:
        previous: { type: ["string", "null"] }
        next: { type: ["string", "null"] }

    ReportInput:
      type: object
      properties:
        reason: { type: string }

    BulkReviewInput:
      type: object
      required:
        - ids
        - action
      properties:
        ids:
          type: array
          items: { type: integer }
        action: { type: string }

    BulkResult:
      type: object
      required:
        - updated
      properties:
        updated: { type: integer }

    PublicSettings:
      type: object
      required:
        - requireApproval
      properties:
        requireApproval: { type: boolean }

    SettingsUpdate:
      type: object
      properties:
        requireApproval: { type: boolean }

    LoginInput:
      type: object
      required:
        - username
        - password
      properties:
        username: { type: string }
        password: { type: string }

    PasswordChangeInput:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 6 }

    AuthResult:
      type: object
      required:
        - success
      properties:
        success: { type: boolean }
        error: { type: ["string", "null"] }

    RatingBucket:
      type: object
      required:
        - rating
        - count
      properties:
        rating: { type: integer }
        count: { type: integer }

    DayBucket:
      type: object
      required:
        - date
        - count
      properties:
        date: { type: string }
        count: { type: integer }

    TopBrand:
      type: object
      required:
        - name
        - count
      properties:
        name: { type: string }
        count: { type: integer }

    RatingTrendPoint:
      type: object
      required:
        - date
        - avg
      properties:
        date: { type: string }
        avg: { type: number }

    Stats:
      type: object
      required:
        - totalBrands
        - totalReviews
        - avgRating
        - pendingReviews
        - reportedReviews
        - ratingDistribution
        - reviewsByDay
        - topBrands
        - avgRatingTrend
      properties:
        totalBrands: { type: integer }
        totalReviews: { type: integer }
        avgRating: { type: number }
        pendingReviews: { type: integer }
        reportedReviews: { type: integer }
        ratingDistribution:
          type: array
          items:
            $ref: "#/components/schemas/RatingBucket"
        reviewsByDay:
          type: array
          items:
            $ref: "#/components/schemas/DayBucket"
        topBrands:
          type: array
          items:
            $ref: "#/components/schemas/TopBrand"
        avgRatingTrend:
          type: array
          items:
            $ref: "#/components/schemas/RatingTrendPoint"
